<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>タスクアサイン</title>
    <link rel="apple-touch-icon" sizes="180x180" href="https://yojinbo-project.github.io/taskassign/task-assign-180.png">
    <link rel="apple-touch-icon-precomposed" sizes="180x180" href="https://yojinbo-project.github.io/taskassign/task-assign-180.png">
    <link rel="icon" type="image/png" sizes="192x192" href="https://yojinbo-project.github.io/taskassign/task-assign-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="https://yojinbo-project.github.io/taskassign/task-assign-512.png">
    <link rel="manifest" href="https://yojinbo-project.github.io/taskassign/manifest.webmanifest">
    <meta name="apple-mobile-web-app-title" content="タスクアサイン">
    <meta name="application-name" content="タスクアサイン">
    <meta name="theme-color" content="#2563eb">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f7f9;
        --panel: #ffffff;
        --text: #1f2933;
        --muted: #687486;
        --accent: #2563eb;
        --line: #d7dce2;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100dvh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: min(480px, 100%);
        display: grid;
        gap: 18px;
        padding: 24px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--panel);
      }

      img {
        width: 96px;
        height: 96px;
        border-radius: 20px;
      }

      h1 {
        margin: 0;
        font-size: 28px;
        line-height: 1.3;
      }

      p {
        margin: 0;
        color: var(--muted);
        font-size: 16px;
        line-height: 1.6;
      }

      a {
        display: grid;
        place-items: center;
        min-height: 56px;
        border-radius: 8px;
        background: var(--accent);
        color: #fff;
        font-size: 18px;
        font-weight: 700;
        text-decoration: none;
      }

      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="https://yojinbo-project.github.io/taskassign/task-assign-192.png" alt="">
      <h1>タスクアサイン</h1>
      <p id="installMessage">このページをSafariの共有メニューから「ホーム画面に追加」してください。ホーム画面のアイコンから起動すると、タスクアサインを開きます。</p>
      <a id="openApp" href="#">タスクアサイン アプリを開く</a>
    </main>

    <script>
      const APP_URL = 'https://script.google.com/a/macros/fuku-c.ed.jp/s/AKfycbx0vmFGb4-4lxkQlYZ_G_fw0J_Dyl8sgrywkWNs0m1GN0MBZsfgZyPsvOw0OhltuN4_Cw/exec';
      const isStandalone = window.navigator.standalone ||
        window.matchMedia('(display-mode: standalone)').matches;

      document.getElementById('openApp').href = APP_URL;

      if (isStandalone) {
        document.getElementById('installMessage').classList.add('hidden');
        document.getElementById('openApp').classList.add('hidden');
        window.location.replace(APP_URL);
      }
    </script>
  </body>
</html>
